name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pruebas (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Librerías del sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint
        run: python -m pyflakes ksb tests tools main.py web/i18n
      - name: Pruebas
        run: python -X faulthandler -m pytest -v -p no:cacheprovider tests

  web:
    name: Web (demo y valoraciones)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Referencia de Python para la demo
        run: python web/tests/make_fixture.py
      - name: Pruebas en Chrome sin ventana
        run: python web/tests/run.py

  build:
    name: Ejecutable (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        # Linux en la Ubuntu más antigua disponible: el ejecutable necesita una glibc igual o más nueva
        # que la de la máquina donde se compila, así funciona también en distribuciones no tan recientes
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Librerías del sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 desktop-file-utils appstream
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Empaquetar con PyInstaller
        run: python tools/build.py
      # En Linux, build.py añade instalar.sh, la entrada del menú y los iconos (tools/linux.py)
      - name: Paquete .deb (Linux)
        if: runner.os == 'Linux'
        run: python tools/linux.py deb
      - name: Comprobar la instalación (Linux)
        if: runner.os == 'Linux'
        run: |
          id=io.github.ryt0n18.keybio
          # .deb: se instala, sale en el menú con su ficha y arranca
          sudo apt-get install -y ./dist/KeyBio-*-linux-amd64.deb
          desktop-file-validate /usr/share/applications/$id.desktop
          appstreamcli validate --no-net /usr/share/metainfo/$id.metainfo.xml
          export KEYBIO_DATA_DIR="$RUNNER_TEMP/keybio-smoke"
          timeout 8 keybio && { echo "KeyBio se ha cerrado al arrancar"; exit 1; } || test $? -eq 124
          sudo apt-get remove -y keybio
          # instalar.sh (el del .tar.gz): instala para el usuario y desinstala sin tocar los datos
          export HOME="$RUNNER_TEMP/home" XDG_DATA_HOME="$RUNNER_TEMP/home/.local/share"
          mkdir -p "$XDG_DATA_HOME/keybio"
          dist/KeyBio/instalar.sh
          desktop-file-validate "$XDG_DATA_HOME/applications/$id.desktop"
          timeout 8 "$HOME/.local/bin/keybio" && { echo "KeyBio se ha cerrado al arrancar"; exit 1; } || test $? -eq 124
          "$HOME/.local/opt/keybio/instalar.sh" --desinstalar
          test ! -e "$HOME/.local/opt/keybio" && test ! -e "$XDG_DATA_HOME/applications/$id.desktop"
          test -d "$XDG_DATA_HOME/keybio"
      - name: Comprobar que el ejecutable arranca (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:KEYBIO_DATA_DIR = "$env:RUNNER_TEMP\keybio-smoke"
          $p = Start-Process -FilePath dist\KeyBio\KeyBio.exe -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) { throw "KeyBio.exe se ha cerrado al arrancar (código $($p.ExitCode))" }
          Stop-Process -Id $p.Id
      - name: Instalador de Windows (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path ksb\__init__.py -Pattern 'APP_VERSION = "(.+)"').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" tools\keybio.iss
      - name: Comprimir (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\KeyBio -DestinationPath dist\KeyBio-windows-x64.zip
      - name: Comprimir (Linux)
        if: runner.os == 'Linux'
        run: tar -czf dist/KeyBio-linux-x64.tar.gz -C dist KeyBio
      - uses: actions/upload-artifact@v7
        with:
          name: KeyBio-${{ runner.os }}
          path: |
            dist/KeyBio-*.zip
            dist/KeyBio-*.tar.gz
            dist/KeyBio-*.deb
            dist/KeyBio-*-setup.exe
          if-no-files-found: error

  macos:
    name: macOS (pruebas, aplicación y .dmg)
    # En repositorios privados cada minuto de macOS cuenta como 10: solo al publicar o a mano
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Pruebas
        run: python -X faulthandler -m pytest -v -p no:cacheprovider tests
      - name: Empaquetar con PyInstaller
        run: python tools/build.py
      - name: Comprobar que la aplicación arranca
        run: |
          export KEYBIO_DATA_DIR="$RUNNER_TEMP/keybio-smoke"
          dist/KeyBio.app/Contents/MacOS/KeyBio &
          pid=$!
          sleep 8
          kill -0 "$pid" || { echo "KeyBio se ha cerrado al arrancar"; exit 1; }
          kill "$pid"
      - name: Imagen de disco (.dmg)
        run: |
          version=$(python -c "import ksb; print(ksb.APP_VERSION)")
          mkdir dmg
          ditto dist/KeyBio.app dmg/KeyBio.app
          ln -s /Applications dmg/Aplicaciones
          hdiutil create -volname "KeyBio $version" -srcfolder dmg -ov -format UDZO "dist/KeyBio-$version-macos-arm64.dmg"
      - uses: actions/upload-artifact@v7
        with:
          name: KeyBio-macOS
          path: dist/KeyBio-*.dmg
          if-no-files-found: error

  release:
    name: Preparar la versión (borrador)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos, web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: La etiqueta coincide con la versión del programa
        run: |
          version=$(sed -n 's/^APP_VERSION = "\(.*\)"/\1/p' ksb/__init__.py)
          test "${GITHUB_REF_NAME}" = "v${version}" || { echo "Etiqueta ${GITHUB_REF_NAME}, versión ${version}"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Notas (sección del CHANGELOG) y sumas SHA-256
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "Falta la sección ${GITHUB_REF_NAME#v} en CHANGELOG.md"; exit 1; }
          cat >> notes.md <<'TXT'

          ---
          Comprueba la descarga con `SHA256SUMS.txt` (`sha256sum -c SHA256SUMS.txt`). Los ejecutables
          no están firmados: Windows (SmartScreen) y macOS (Gatekeeper) avisarán la primera vez.
          TXT
          cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Se crea como borrador: nadie más lo ve (aunque el repositorio sea público) hasta publicarlo
      # a mano con «gh release edit vX.Y.Z --draft=false». Ver docs/publicar.md.
      - name: Crear el borrador con los ejecutables
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --repo "${{ github.repository }}" --draft --verify-tag --title "KeyBio ${GITHUB_REF_NAME}" --notes-file notes.md
