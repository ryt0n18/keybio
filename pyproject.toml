[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keybio"
dynamic = ["version"]
description = "Biometría del comportamiento basada en la dinámica de tecleo (Linux, Windows y macOS)"
readme = "README.md"
authors = [{ name = "Álvaro Ruiz (ryt0n18)" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.5; python_version >= '3.12'",
    "PySide6-Essentials>=6.5,<6.12; python_version < '3.12'",
    "cryptography>=42",
]
classifiers = [
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Environment :: X11 Applications :: Qt",
    "Natural Language :: Spanish",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3", "pyinstaller>=6"]

[project.gui-scripts]
keybio = "ksb.gui.app:main"

[tool.setuptools.dynamic]
version = { attr = "ksb.APP_VERSION" }   # la versión se cambia solo en ksb/__init__.py

[tool.setuptools.packages.find]
include = ["ksb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
